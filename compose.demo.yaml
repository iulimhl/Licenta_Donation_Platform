services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.demo
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://donation:donation@database:5432/donations
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY before starting the demo}
    mem_limit: 512m
    cpus: 0.1
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ping', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: donations
      POSTGRES_USER: donation
      POSTGRES_PASSWORD: donation
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donation -d donations"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  database:
