name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ALLOW_EMBEDDING_MODEL_DOWNLOAD: "false"
      ENABLE_EMBEDDING_NAME_MATCH: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/test-results.xml
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 90

  docker:
    name: Docker application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install smoke test dependencies
        run: python -m pip install requests==2.34.2
      - name: Build and start application
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Run browser tests against containers
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_API_URL: http://127.0.0.1:8080/api
        run: npm run test:e2e
      - name: Check data persistence and AI embeddings
        run: python backend/tests/docker_smoke.py
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Save Docker test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-test-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 90
      - name: Stop containers
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install shared dependencies
        run: npm ci --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Save frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 90

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install shared dependencies
        run: npm ci --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check Chrome
        run: google-chrome --version
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Save browser test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 90
